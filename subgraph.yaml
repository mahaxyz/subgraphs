specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ZAI
    network: base
    source:
      address: "0x69000dFD5025E82f48Eb28325A2B88a241182CEd"
      abi: erc20
      startBlock: 22563470
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - TokenBalance
        - Mint
        - TokenRate
      abis:
        - name: erc20
          file: ./abis/erc20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransferZAI
      file: ./src/erc20balance.ts
